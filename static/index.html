<!DOCTYPE html>
<html lang="es" style="color-scheme: dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard SSH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2334d399' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 17 10 11 4 5'/><line x1='12' x2='20' y1='19' y2='19'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }
  </style>
</head>
<body class="min-h-screen bg-zinc-950 font-sans text-zinc-100 antialiased">
  <div class="mx-auto max-w-6xl space-y-6 px-4 py-6 sm:px-6">

    <!-- Encabezado -->
    <header class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="grid size-10 place-items-center rounded-lg bg-emerald-500/10 text-emerald-400 ring-1 ring-emerald-500/30">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
        </div>
        <div>
          <h1 class="text-lg font-semibold tracking-tight">Dashboard SSH</h1>
          <p class="font-mono text-xs text-zinc-400" id="destino">cargando…</p>
        </div>
      </div>
      <div class="flex items-center gap-2 rounded-full border border-zinc-800 bg-zinc-900 px-3 py-1 text-xs text-zinc-400">
        <span id="estado-punto" class="size-2 rounded-full bg-emerald-400"></span>
        <span id="estado-texto">Listo</span>
      </div>
    </header>

    <!-- Comando rápido (ad-hoc) -->
    <section class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-4">
      <h2 class="mb-3 text-xs font-medium uppercase tracking-wider text-zinc-400">Comando rápido</h2>
      <form id="form-adhoc" class="flex flex-col gap-2 sm:flex-row">
        <div class="relative flex-1">
          <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center font-mono text-sm text-emerald-400">&gt;</span>
          <input id="input-adhoc" type="text" autocomplete="off" spellcheck="false"
                 placeholder="dir C:\   (↑ / ↓ recorre el historial)"
                 class="w-full rounded-lg border border-zinc-700 bg-zinc-950 py-2.5 pl-8 pr-3 font-mono text-sm text-zinc-100 placeholder:text-zinc-600 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
        </div>
        <button type="submit"
                class="inline-flex items-center justify-center gap-2 rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-emerald-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400/60">
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          Ejecutar
        </button>
      </form>
    </section>

    <div class="grid gap-6 lg:grid-cols-2">
    <!-- Botonera de comandos guardados -->
    <section class="min-w-0">
      <div class="mb-3 flex items-center justify-between gap-4">
        <h2 class="text-xs font-medium uppercase tracking-wider text-zinc-400">
          Comandos guardados <span id="contador" class="ml-1 text-zinc-600"></span>
        </h2>
        <button id="btn-nuevo" type="button"
                class="inline-flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-1.5 text-sm text-zinc-200 transition hover:border-emerald-500/60 hover:text-emerald-300">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          Nuevo comando
        </button>
      </div>
      <div id="grilla" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
      <div id="vacio" class="hidden rounded-xl border border-dashed border-zinc-800 p-8 text-center text-sm text-zinc-500">
        No hay comandos guardados. Usá <span class="text-zinc-300">Nuevo comando</span> para crear el primero.
      </div>
    </section>

    <!-- Explorador de archivos -->
    <section class="min-w-0">
      <div class="mb-3 flex h-[34px] items-center justify-between gap-4">
        <h2 class="text-xs font-medium uppercase tracking-wider text-zinc-400">
          Explorador de archivos <span id="exp-contador" class="ml-1 text-zinc-600"></span>
          <span id="exp-cargando" class="ml-1 hidden animate-pulse normal-case tracking-normal text-amber-400/80">cargando…</span>
        </h2>
        <button id="exp-recargar" type="button" title="Recargar" aria-label="Recargar"
                class="rounded-md p-1.5 text-zinc-500 transition hover:bg-zinc-800 hover:text-zinc-100">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
      </div>
      <div class="overflow-hidden rounded-xl border border-zinc-800 bg-zinc-900/60">
        <form id="exp-barra" class="flex gap-2 border-b border-zinc-800 p-2">
          <button id="exp-subir" type="button" disabled
                  class="shrink-0 whitespace-nowrap rounded-md border border-zinc-700 bg-zinc-900 px-2.5 py-1.5 text-xs text-zinc-200 transition hover:border-emerald-500/60 hover:text-emerald-300 disabled:pointer-events-none disabled:opacity-40">
            ⬆️ Subir un nivel
          </button>
          <div class="relative min-w-0 flex-1">
            <input id="exp-ruta" type="text" spellcheck="false" autocomplete="off" title="Escribí una ruta y Enter para ir"
                   class="w-full rounded-md border border-zinc-800 bg-zinc-950 py-1.5 pl-2.5 pr-8 font-mono text-xs text-zinc-200 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
            <button id="exp-copiar-ruta" type="button" title="Copiar ruta" aria-label="Copiar ruta"
                    class="absolute right-1 top-1/2 -translate-y-1/2 rounded p-1 text-zinc-500 transition hover:bg-zinc-800 hover:text-zinc-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50 disabled:pointer-events-none disabled:opacity-30 data-[ok]:text-emerald-400"></button>
          </div>
        </form>
        <p id="exp-error" class="hidden border-b border-red-500/20 bg-red-500/10 px-3 py-2 text-xs text-red-300"></p>
        <ul id="exp-lista" class="h-80 overflow-y-auto p-1 transition-opacity"></ul>
      </div>
    </section>
    </div>

    <!-- Terminal -->
    <section class="overflow-hidden rounded-xl border border-zinc-800 bg-black shadow-2xl shadow-black/50">
      <div class="flex items-center justify-between border-b border-zinc-800 bg-zinc-900 px-4 py-2">
        <div class="flex items-center gap-2">
          <span class="size-3 rounded-full bg-red-500/80"></span>
          <span class="size-3 rounded-full bg-yellow-500/80"></span>
          <span class="size-3 rounded-full bg-green-500/80"></span>
          <span class="ml-2 font-mono text-xs text-zinc-500">consola</span>
        </div>
        <button id="btn-limpiar" type="button"
                class="inline-flex items-center gap-1.5 rounded-md px-2 py-1 text-xs text-zinc-400 transition hover:bg-zinc-800 hover:text-zinc-100">
          <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          Limpiar consola
        </button>
      </div>
      <div id="terminal"
           class="h-[45vh] min-h-64 overflow-y-auto whitespace-pre-wrap break-words p-4 font-mono text-[13px] leading-relaxed text-green-400"></div>
    </section>
  </div>

  <!-- Modal crear / editar -->
  <dialog id="modal" class="m-auto w-full max-w-lg rounded-xl border border-zinc-800 bg-zinc-900 p-0 text-zinc-100 shadow-2xl backdrop:bg-black/70 backdrop:backdrop-blur-sm">
    <form id="form-modal" class="space-y-4 p-5">
      <h3 id="modal-titulo" class="text-base font-semibold">Nuevo comando</h3>
      <label class="block space-y-1.5">
        <span class="text-xs font-medium uppercase tracking-wider text-zinc-400">Nombre</span>
        <input id="modal-nombre" type="text" required autocomplete="off" placeholder="Compilar App"
               class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm placeholder:text-zinc-600 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
      </label>
      <label class="block space-y-1.5">
        <span class="text-xs font-medium uppercase tracking-wider text-zinc-400">Comando</span>
        <textarea id="modal-comando" required rows="3" spellcheck="false" placeholder="cd C:\App && gradlew.bat"
                  class="w-full resize-y rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 font-mono text-sm placeholder:text-zinc-600 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"></textarea>
        <span class="block text-xs text-zinc-500">Se ejecuta como <code class="font-mono text-zinc-400">ssh <span class="destino-texto"></span> &lt;comando&gt;</code> · Ctrl+Enter para guardar</span>
      </label>
      <p id="modal-error" class="hidden rounded-md bg-red-500/10 px-3 py-2 text-sm text-red-300"></p>
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" id="modal-cancelar"
                class="rounded-lg px-4 py-2 text-sm text-zinc-300 transition hover:bg-zinc-800">Cancelar</button>
        <button type="submit"
                class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-500">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Plantilla de tarjeta de comando -->
  <template id="tpl-tarjeta">
    <div class="group relative rounded-lg border border-zinc-800 bg-zinc-900 transition hover:border-emerald-500/50 hover:bg-zinc-900/70">
      <button type="button" data-accion="ejecutar" class="block w-full rounded-lg p-4 text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50">
        <span class="flex items-center gap-2 pr-16">
          <svg class="size-3.5 shrink-0 text-emerald-400" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          <span data-campo="nombre" class="truncate text-sm font-medium text-zinc-100"></span>
        </span>
        <code data-campo="comando" class="mt-2 block truncate font-mono text-xs text-zinc-500"></code>
      </button>
      <div class="absolute right-2 top-2 flex gap-0.5">
        <button type="button" data-accion="editar" title="Editar" aria-label="Editar"
                class="rounded-md p-1.5 text-zinc-500 transition hover:bg-zinc-800 hover:text-zinc-100">
          <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
        </button>
        <button type="button" data-accion="eliminar" title="Eliminar" aria-label="Eliminar"
                class="rounded-md p-1.5 text-zinc-500 transition hover:bg-red-500/10 hover:text-red-400">
          <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
  </template>

  <!-- Notificaciones -->
  <div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-50 flex flex-col items-end gap-2"></div>

  <script>
    const $ = (sel) => document.querySelector(sel);

    let destino = '';
    let comandos = [];
    let enCurso = 0;
    let editandoId = null;

    // ---------- API ----------

    async function api(ruta, opciones = {}) {
      const resp = await fetch(ruta, {
        ...opciones,
        headers: opciones.body ? { 'Content-Type': 'application/json' } : undefined,
      });
      if (!resp.ok) {
        let detalle = `${resp.status} ${resp.statusText}`;
        try {
          const cuerpo = await resp.json();
          if (typeof cuerpo.detail === 'string') detalle = cuerpo.detail;
          else if (Array.isArray(cuerpo.detail)) detalle = cuerpo.detail.map((d) => `${d.loc.at(-1)}: ${d.msg}`).join(' · ');
        } catch { /* respuesta sin JSON */ }
        throw new Error(detalle);
      }
      return resp.status === 204 ? null : resp.json();
    }

    // ---------- Notificaciones ----------

    function toast(mensaje, tipo = 'ok') {
      const el = document.createElement('div');
      el.className = 'rounded-lg border px-4 py-2 text-sm shadow-lg transition duration-300 ' +
        (tipo === 'error'
          ? 'border-red-500/30 bg-red-950/90 text-red-200'
          : 'border-emerald-500/30 bg-zinc-900/95 text-emerald-200');
      el.textContent = mensaje;
      $('#toasts').append(el);
      setTimeout(() => { el.style.opacity = '0'; }, 2500);
      setTimeout(() => el.remove(), 2800);
    }

    // ---------- Estado de ejecución ----------

    function cambiarEnCurso(delta) {
      enCurso += delta;
      const activo = enCurso > 0;
      $('#estado-punto').className = 'size-2 rounded-full ' + (activo ? 'animate-pulse bg-amber-400' : 'bg-emerald-400');
      $('#estado-texto').textContent = activo ? `Ejecutando (${enCurso})` : 'Listo';
    }

    // ---------- Terminal ----------

    const terminal = $('#terminal');

    function span(texto, clase) {
      const el = document.createElement('span');
      el.className = clase;
      el.textContent = texto;
      return el;
    }

    // Agrega contenido manteniendo el scroll abajo, salvo que el usuario haya subido a leer.
    function agregarATerminal(nodo, contenedor = terminal) {
      const pegadoAbajo = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 40;
      contenedor.append(nodo);
      if (pegadoAbajo) terminal.scrollTop = terminal.scrollHeight;
    }

    function lineaSistema(texto) {
      const div = document.createElement('div');
      div.append(span(texto, 'text-zinc-500'));
      agregarATerminal(div);
    }

    function crearBloque(comando) {
      const bloque = document.createElement('div');
      bloque.className = 'mb-3';

      const cabecera = document.createElement('div');
      cabecera.append(
        span(`[${new Date().toLocaleTimeString()}] `, 'text-zinc-600'),
        span(destino, 'text-emerald-300'),
        span('> ', 'text-zinc-500'),
        span(comando, 'font-semibold text-zinc-100'),
      );

      const salida = document.createElement('div');
      salida.append(span('ejecutando…', 'animate-pulse text-amber-400/80'));

      bloque.append(cabecera, salida);
      agregarATerminal(bloque);
      return salida;
    }

    function completarBloque(salida, r) {
      salida.replaceChildren();
      const partes = [];
      if (r.stdout) partes.push(span(r.stdout.replace(/\n$/, '') + '\n', 'text-green-400'));
      if (r.stderr) partes.push(span(r.stderr.replace(/\n$/, '') + '\n', 'text-red-400'));
      if (!partes.length) partes.push(span('(sin salida)\n', 'italic text-zinc-600'));

      const segundos = (r.duracion_ms / 1000).toFixed(2);
      if (r.timeout) {
        partes.push(span(`✗ tiempo agotado tras ${segundos} s (proceso ssh terminado)`, 'text-amber-400'));
      } else {
        const ok = r.codigo_salida === 0;
        partes.push(span(`${ok ? '✓' : '✗'} código ${r.codigo_salida} · ${segundos} s`, ok ? 'text-zinc-600' : 'text-amber-400'));
      }
      partes.forEach((p) => agregarATerminal(p, salida));
    }

    function errorBloque(salida, mensaje) {
      salida.replaceChildren();
      agregarATerminal(span(`✗ error del dashboard: ${mensaje}`, 'text-red-400'), salida);
    }

    async function ejecutar(comando) {
      comando = comando.trim();
      if (!comando) return;
      const salida = crearBloque(comando);
      cambiarEnCurso(+1);
      try {
        const r = await api('/api/ejecutar', { method: 'POST', body: JSON.stringify({ comando }) });
        completarBloque(salida, r);
      } catch (e) {
        errorBloque(salida, e.message);
      } finally {
        cambiarEnCurso(-1);
      }
    }

    $('#btn-limpiar').addEventListener('click', () => terminal.replaceChildren());

    // ---------- Comando rápido + historial ----------

    const inputAdhoc = $('#input-adhoc');
    let historial = [];
    try { historial = JSON.parse(localStorage.getItem('ssh-historial')) || []; } catch { /* sin storage */ }
    let posHistorial = historial.length;

    $('#form-adhoc').addEventListener('submit', (e) => {
      e.preventDefault();
      const comando = inputAdhoc.value.trim();
      if (!comando) return;
      if (historial.at(-1) !== comando) historial.push(comando);
      historial = historial.slice(-50);
      posHistorial = historial.length;
      try { localStorage.setItem('ssh-historial', JSON.stringify(historial)); } catch { /* sin storage */ }
      inputAdhoc.value = '';
      ejecutar(comando);
    });

    inputAdhoc.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      posHistorial = Math.max(0, Math.min(historial.length, posHistorial + (e.key === 'ArrowUp' ? -1 : 1)));
      inputAdhoc.value = historial[posHistorial] ?? '';
    });

    // ---------- Botonera (CRUD) ----------

    async function cargarComandos() {
      try {
        comandos = await api('/api/comandos');
        renderGrilla();
      } catch (e) {
        toast(`No se pudieron cargar los comandos: ${e.message}`, 'error');
      }
    }

    function renderGrilla() {
      const grilla = $('#grilla');
      const tpl = $('#tpl-tarjeta');
      grilla.replaceChildren(...comandos.map((cmd) => {
        const tarjeta = tpl.content.firstElementChild.cloneNode(true);
        tarjeta.dataset.id = cmd.id;
        tarjeta.querySelector('[data-campo="nombre"]').textContent = cmd.nombre;
        const codigo = tarjeta.querySelector('[data-campo="comando"]');
        codigo.textContent = cmd.comando_ssh;
        codigo.title = cmd.comando_ssh;
        return tarjeta;
      }));
      $('#vacio').classList.toggle('hidden', comandos.length > 0);
      $('#contador').textContent = comandos.length ? `(${comandos.length})` : '';
    }

    $('#grilla').addEventListener('click', async (e) => {
      const boton = e.target.closest('[data-accion]');
      if (!boton) return;
      const cmd = comandos.find((c) => c.id === boton.closest('[data-id]').dataset.id);
      if (!cmd) return;

      if (boton.dataset.accion === 'ejecutar') {
        ejecutar(cmd.comando_ssh);
      } else if (boton.dataset.accion === 'editar') {
        abrirModal(cmd);
      } else if (boton.dataset.accion === 'eliminar') {
        if (!confirm(`¿Eliminar el comando "${cmd.nombre}"?`)) return;
        try {
          await api(`/api/comandos/${encodeURIComponent(cmd.id)}`, { method: 'DELETE' });
          toast(`"${cmd.nombre}" eliminado`);
          await cargarComandos();
        } catch (err) {
          toast(`No se pudo eliminar: ${err.message}`, 'error');
        }
      }
    });

    // ---------- Modal ----------

    const modal = $('#modal');
    const modalNombre = $('#modal-nombre');
    const modalComando = $('#modal-comando');
    const modalError = $('#modal-error');

    function abrirModal(cmd = null) {
      editandoId = cmd?.id ?? null;
      $('#modal-titulo').textContent = cmd ? 'Editar comando' : 'Nuevo comando';
      modalNombre.value = cmd?.nombre ?? '';
      modalComando.value = cmd?.comando_ssh ?? '';
      modalError.classList.add('hidden');
      modal.showModal();
      modalNombre.focus();
    }

    $('#btn-nuevo').addEventListener('click', () => abrirModal());
    $('#modal-cancelar').addEventListener('click', () => modal.close());
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); }); // clic en el fondo
    modalComando.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#form-modal').requestSubmit();
    });

    $('#form-modal').addEventListener('submit', async (e) => {
      e.preventDefault();
      const cuerpo = JSON.stringify({ nombre: modalNombre.value.trim(), comando_ssh: modalComando.value.trim() });
      try {
        if (editandoId) {
          await api(`/api/comandos/${encodeURIComponent(editandoId)}`, { method: 'PUT', body: cuerpo });
        } else {
          await api('/api/comandos', { method: 'POST', body: cuerpo });
        }
        modal.close();
        toast(editandoId ? 'Comando actualizado' : 'Comando creado');
        await cargarComandos();
      } catch (err) {
        modalError.textContent = err.message;
        modalError.classList.remove('hidden');
      }
    });

    // ---------- Explorador de archivos ----------

    let currentPath = '';   // '' hasta la primera carga: el backend abre la carpeta de usuario remota
    let padreActual = null;
    let enDiscos = false;   // vista "Este equipo": la lista de unidades, un nivel arriba de C:\
    let ultimoPedido = 0;   // descarta respuestas viejas si se navega rápido

    const expLista = $('#exp-lista');
    const expRuta = $('#exp-ruta');
    const expSubir = $('#exp-subir');
    const expError = $('#exp-error');
    const expCopiarRuta = $('#exp-copiar-ruta');

    // En la vista de unidades cada nombre ("C:\") ya es una ruta completa.
    function rutaDe(nombre) {
      if (enDiscos) return nombre;
      return currentPath.endsWith('\\') ? currentPath + nombre : `${currentPath}\\${nombre}`;
    }

    function formatearBytes(bytes) {
      const gb = bytes / 1024 ** 3;
      return gb >= 1000 ? `${(gb / 1024).toFixed(1)} TB` : `${Math.round(gb)} GB`;
    }

    function detalleDisco(disco) {
      if (!disco.Listo) return 'no disponible';
      return [disco.Etiqueta, `${formatearBytes(disco.Libre)} libres de ${formatearBytes(disco.Total)}`]
        .filter(Boolean).join(' · ');
    }

    const ICONO_COPIAR = '<svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
    const ICONO_COPIADO = '<svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

    async function copiarTexto(texto) {
      try {
        await navigator.clipboard.writeText(texto);
      } catch {
        // Método viejo con un textarea: para http://<ip-de-tailscale> (no es contexto seguro,
        // navigator.clipboard no existe) o navegadores que niegan el permiso de portapapeles.
        const area = document.createElement('textarea');
        area.value = texto;
        area.style.cssText = 'position:fixed;opacity:0';
        document.body.append(area);
        area.select();
        const ok = document.execCommand('copy');
        area.remove();
        if (!ok) throw new Error('el navegador no lo permitió');
      }
    }

    // Copia y muestra un ✓ en el mismo botón durante un momento.
    async function copiarConAviso(boton, texto) {
      try {
        await copiarTexto(texto);
      } catch (e) {
        toast(`No se pudo copiar: ${e.message}`, 'error');
        return;
      }
      boton.innerHTML = ICONO_COPIADO;
      boton.setAttribute('data-ok', '');
      clearTimeout(boton.temporizador);
      boton.temporizador = setTimeout(() => {
        boton.innerHTML = ICONO_COPIAR;
        boton.removeAttribute('data-ok');
      }, 1200);
    }

    // El estado (currentPath) se actualiza recién cuando la PC remota confirma la ruta:
    // si falla (no existe, sin permisos) el explorador se queda donde estaba.
    async function explorar(ruta) {
      const pedido = ++ultimoPedido;
      expLista.classList.add('pointer-events-none', 'opacity-50');
      $('#exp-cargando').classList.remove('hidden');
      try {
        const r = await api('/api/explorar', { method: 'POST', body: JSON.stringify({ path: ruta }) });
        if (pedido !== ultimoPedido) return;
        currentPath = r.path;
        padreActual = r.padre;
        enDiscos = r.discos;
        expError.classList.add('hidden');
        renderExplorador(r.items);
      } catch (e) {
        if (pedido !== ultimoPedido) return;
        expError.textContent = e.message;
        expError.classList.remove('hidden');
      } finally {
        if (pedido === ultimoPedido) {
          expLista.classList.remove('pointer-events-none', 'opacity-50');
          $('#exp-cargando').classList.add('hidden');
          expRuta.value = currentPath;
          expSubir.disabled = !padreActual;
          expCopiarRuta.disabled = enDiscos;  // "Este equipo" no es una ruta
        }
      }
    }

    function renderExplorador(items) {
      $('#exp-contador').textContent = `(${items.length})`;
      expLista.scrollTop = 0;
      if (!items.length) {
        const vacio = document.createElement('li');
        vacio.className = 'px-3 py-10 text-center text-sm text-zinc-500';
        vacio.textContent = 'Carpeta vacía';
        expLista.replaceChildren(vacio);
        return;
      }
      expLista.replaceChildren(...items.map((item) => {
        const fila = document.createElement('li');
        fila.dataset.nombre = item.Name;
        if (item.IsFolder) fila.dataset.carpeta = '';
        fila.className = 'group flex items-center rounded-md transition hover:bg-zinc-800/80 data-[sel]:bg-emerald-500/15';

        const principal = document.createElement('button');
        principal.type = 'button';
        principal.title = item.Name;
        principal.className = 'flex min-w-0 flex-1 items-center gap-2.5 rounded-md px-2.5 py-1.5 text-left text-sm ' +
          'focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50 group-data-[sel]:text-emerald-200 ' +
          (item.IsFolder ? 'text-zinc-100' : 'text-zinc-400');
        if (enDiscos) {
          principal.append(span('💽', 'shrink-0'), span(item.Name, 'shrink-0'),
            span(detalleDisco(item), 'truncate text-xs text-zinc-500'));
        } else {
          principal.append(span(item.IsFolder ? '📁' : '📄', 'shrink-0'), span(item.Name, 'truncate'));
        }

        const copiar = document.createElement('button');
        copiar.type = 'button';
        copiar.dataset.copiar = '';
        copiar.title = 'Copiar ruta';
        copiar.setAttribute('aria-label', `Copiar ruta de ${item.Name}`);
        copiar.className = 'mr-1 shrink-0 rounded p-1.5 text-zinc-600 transition hover:bg-zinc-700/70 hover:text-zinc-100 ' +
          'focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50 data-[ok]:text-emerald-400';
        copiar.innerHTML = ICONO_COPIAR;

        fila.append(principal, copiar);
        return fila;
      }));
    }

    expLista.addEventListener('click', (e) => {
      const boton = e.target.closest('button');
      const fila = boton?.closest('li[data-nombre]');
      if (!fila) return;
      const ruta = rutaDe(fila.dataset.nombre);
      if ('copiar' in boton.dataset) {
        copiarConAviso(boton, ruta);
      } else if ('carpeta' in fila.dataset) {
        explorar(ruta);
      } else {
        expLista.querySelector('[data-sel]')?.removeAttribute('data-sel');
        fila.setAttribute('data-sel', '');
        lineaSistema(`📄 ${ruta}`);
      }
    });

    expCopiarRuta.innerHTML = ICONO_COPIAR;
    expCopiarRuta.addEventListener('click', () => {
      const ruta = expRuta.value.trim();
      if (ruta) copiarConAviso(expCopiarRuta, ruta);
    });

    expSubir.addEventListener('click', () => { if (padreActual) explorar(padreActual); });
    $('#exp-recargar').addEventListener('click', () => explorar(currentPath));
    $('#exp-barra').addEventListener('submit', (e) => {
      e.preventDefault();
      explorar(expRuta.value.trim());
    });
    expRuta.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') expRuta.value = currentPath;
    });

    // ---------- Inicio ----------

    (async () => {
      try {
        ({ destino } = await api('/api/config'));
      } catch {
        destino = 'ssh';
      }
      $('#destino').textContent = destino;
      document.querySelectorAll('.destino-texto').forEach((el) => { el.textContent = destino; });
      lineaSistema(`Dashboard SSH listo · destino ${destino}`);
      explorar('');
      await cargarComandos();
      inputAdhoc.focus();
    })();
  </script>
</body>
</html>
